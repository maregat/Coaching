<svg xmlns="http://www.w3.org/2000/svg" id="board" viewBox="0 0 900 700" role="img" aria-label="4 plus 1 gegen 4 plus 1 Ballverlustsituation mit schneller Reaktion, Bremsen und Rückkehr in die Absicherung">
  <style>
    .token-text { fill: #fff; font: 700 20px sans-serif; text-anchor: middle; dominant-baseline: central; }
    .token-gk { fill: #123b2b; stroke: #fff; stroke-width: 3; }
    .token-red { fill: #df713f; stroke: #fff; stroke-width: 3; }
    .token-blue { fill: #28648a; stroke: #fff; stroke-width: 3; }
    .ball { fill: #f2bc70; stroke: #fff3d0; stroke-width: 3; }
    .question { fill: #fff7d1; font: 700 52px sans-serif; text-anchor: middle; }
    .arrow-line { fill: none; stroke-width: 4; }
    .arrow-press { stroke: #f2bc70; }
    .arrow-guard { stroke: #dceee2; }
    .arrow-attack { stroke: #fff7d1; }
    .label-bg { fill: rgba(18,59,43,.9); }
    .label-text { fill: #fff; font: 700 30px sans-serif; text-anchor: middle; dominant-baseline: central; }
  </style>
  <defs>
    <marker id="arrowHeadPress" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#f2bc70" stroke-width="2"/></marker>
    <marker id="arrowHeadGuard" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#dceee2" stroke-width="2"/></marker>
    <marker id="arrowHeadAttack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#fff7d1" stroke-width="2"/></marker>
  </defs>
  <rect x="8" y="8" width="884" height="684" rx="8" fill="#37804f" stroke="#fff" stroke-opacity=".75" stroke-width="5"/>
  <line x1="8" y1="350" x2="892" y2="350" stroke="#fff" stroke-opacity=".48" stroke-width="3" stroke-dasharray="10 7"/>
  <path d="M8 300 H26 V400 H8" fill="none" stroke="#fff" stroke-width="4"/><path d="M892 300 H874 V400 H892" fill="none" stroke="#fff" stroke-width="4"/>

  <g class="editable" data-kind="token" data-name="Rote Torhüterin" transform="translate(75 350)"><circle class="token-shape token-gk" r="27"/><text class="token-text" y="1">TW</text></g>
  <g class="editable" data-kind="token" data-name="R1" transform="translate(565 80)"><circle class="token-shape token-red" r="27"/><text class="token-text" y="1">R1</text></g>
  <g class="editable" data-kind="token" data-name="R2" transform="translate(655 530)"><circle class="token-shape token-red" r="27"/><text class="token-text" y="1">R2</text></g>
  <g class="editable" data-kind="token" data-name="R3" transform="translate(420 300)"><circle class="token-shape token-red" r="27"/><text class="token-text" y="1">R3</text></g>
  <g class="editable" data-kind="token" data-name="R4" transform="translate(255 285)"><circle class="token-shape token-red" r="27"/><text class="token-text" y="1">R4</text></g>

  <g class="editable" data-kind="token" data-name="Blaue Torhüterin" transform="translate(825 350)"><circle class="token-shape token-gk" r="27"/><text class="token-text" y="1">TW</text></g>
  <g class="editable" data-kind="token" data-name="B1" transform="translate(650 150)"><circle class="token-shape token-blue" r="27"/><text class="token-text" y="1">B1</text></g>
  <g class="editable" data-kind="token" data-name="B2" transform="translate(730 500)"><circle class="token-shape token-blue" r="27"/><text class="token-text" y="1">B2</text></g>
  <g class="editable" data-kind="token" data-name="B3 · Ballführende" transform="translate(525 335)"><circle class="token-shape token-blue" r="27"/><circle class="ball" cx="24" cy="24" r="11"/><text class="token-text" y="1">B3</text></g>
  <g class="editable" data-kind="token" data-name="B4" transform="translate(758 346)"><circle class="token-shape token-blue" r="27"/><text class="token-text" y="1">B4</text></g>

  <g class="editable" data-kind="question" data-name="Entscheidungsmoment" transform="translate(460 130)"><text class="question" y="16">?</text></g>

  <g class="editable" data-kind="arrow" data-name="Option: Bremse" transform="translate(520 335)"><line class="arrow-line arrow-press" x1="0" y1="0" x2="-80" y2="-30" marker-end="url(#arrowHeadPress)"/></g>
  <g class="editable selected" data-kind="arrow" data-name="Option: Rückkehr" transform="translate(420 325)"><line class="arrow-line arrow-guard" x1="0" y1="0" x2="-135" y2="15" marker-end="url(#arrowHeadGuard)"/></g>
  <g class="editable" data-kind="arrow" data-name="Option: Angriff" transform="translate(545 330)"><line class="arrow-line arrow-attack" x1="0" y1="0" x2="150" y2="-160" marker-end="url(#arrowHeadAttack)"/></g>

  <g class="editable" data-kind="label" data-name="Beschriftung Bremse" data-text="Bremse" transform="translate(345 245)"><rect class="label-bg" x="-100" y="-33" width="200" height="66"/><text class="label-text" y="3">Bremse</text></g>
  <g class="editable" data-kind="label" data-name="Beschriftung Rückkehr" data-text="Zurück / sichern" transform="translate(235 388)"><rect class="label-bg" x="-165" y="-33" width="330" height="66"/><text class="label-text" y="3">Zurück / sichern</text></g>
  <g class="editable" data-kind="label" data-name="Beschriftung Angriff" data-text="Weiterer Angriff" transform="translate(700 186)"><rect class="label-bg" x="-150" y="-33" width="300" height="66"/><text class="label-text" y="3">Weiterer Angriff</text></g>
</svg>
