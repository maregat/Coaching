    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    }

      font-weight: 700;
      color: #1a3d2b;
    }

      transition: color 0.2s;
    }
    
    .header a:hover {
      color: #1a3d2b;
    }
    
    .plans-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .plan-card {
      background: white;
      border: 1px solid #e2e5e0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    
    .plan-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      border-color: #1a3d2b;
    }
    
    .plan-header {
      padding: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafaf9;
      border-bottom: 1px solid #e2e5e0;
      transition: background 0.2s;
    }
    
    .plan-card:hover .plan-header {
      background: #f5f5f3;
    }
    
    .plan-info {
      flex: 1;
    }
    
    .plan-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a3d2b;
      margin-bottom: 6px;
    }
    
    .plan-meta {
      font-size: 13px;
      color: #6b756e;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .plan-toggle {
      font-size: 20px;
      color: #6b756e;
      transition: transform 0.3s, color 0.2s;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .plan-card.expanded .plan-toggle {
      transform: rotate(180deg);
      color: #1a3d2b;
    }
    
    .plan-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .plan-card.expanded .plan-content {
      max-height: 8000px;
    }
    
    .plan-body {
      padding: 24px;
      line-height: 1.8;
    }
    
    .plan-body h2 {
      font-size: 16px;
      font-weight: 700;
      color: #1a3d2b;
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e5e0;
    }
    
    .plan-body h2:first-child {
      margin-top: 0;
    }
    
    .plan-body h3 {
      font-size: 14px;
      font-weight: 600;
      color: #2d6a4f;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    
    .plan-body p {
      font-size: 14px;
      color: #1f2a24;
      margin-bottom: 12px;
    }
    
    .plan-body ul, .plan-body ol {
      margin: 12px 0 12px 24px;
      font-size: 14px;
    }
    
    .plan-body li {
      margin-bottom: 6px;
      color: #1f2a24;
    }
    
    .plan-body strong {
      color: #1a3d2b;
      font-weight: 600;
    }
    
    .time-table {
      width: 100%;
      margin: 16px 0;
      border-collapse: collapse;
      font-size: 14px;
    }
    
    .time-table th {
      background: #f5f5f3;
      padding: 10px;
      text-align: left;
      font-weight: 600;
      color: #1a3d2b;
      border-bottom: 2px solid #e2e5e0;
    }
    
    .time-table td {
      padding: 10px;
      border-bottom: 1px solid #e2e5e0;
      color: #1f2a24;
    }
    
    .time-table tr:hover {
      background: #fafaf9;
    }
    
    .feedback-box {
      background: #fff3e0;
      border-left: 4px solid #df713f;
      padding: 12px;
      margin: 16px 0;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .success-box {
      background: #e8f5e9;
      border-left: 4px solid #2d6a4f;
      padding: 12px;
      margin: 16px 0;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .tag {
      display: inline-block;
      background: #e8f5e9;
      color: #1b5e20;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      margin-right: 8px;
    }
    
    @media (max-width: 600px) {
      .plan-header {
        padding: 16px;
      }
      
      .plan-body {
        padding: 16px;
      }
      
      .plan-title {
        font-size: 16px;
      }
      
      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

            <li>Punkte/Tore-Tally (aber nur zum Spaß!)</li>
            <li>Wechsel Teams nach jedem Spiel</li>
            <li>Fokus: Wie fühlt sich Turnier an? TW-Rollen klar?</li>
          </ul>

          <h3>Option B: Großspiel + Rotation</h3>
          <ul>
            <li>8v4 oder 6v6, aber regelmäßige Wechsel</li>
            <li>Mehrere TW rotieren durchgehend</li>
            <li>Raute-Positionen spielen (ohne zu sagen)</li>
          </ul>

          <h2>Phase 7: Reflexion – Turnier-Ausblick (3 Min)</h2>
          <ul>
            <li>Kreis bilden</li>
            <li>„Wie war es in der Raute?" / „Wer fühlt sich bereit?"</li>
            <li><strong>Trainer-Abschlusswort:</strong> „Morgen beim Turnier: Spaß, Teamgeist, wir spielen zusammen! Guter Plan – wir machen das!"</li>
            <li>Motivational Energy, keine Angst!</li>
          </ul>

          <h2>🎯 Turnier-Vorbereitung (Meta-Hinweise)</h2>
          <div class="success-box">
            <strong>✓ Nach Einheit 3 sollten Spieler/TW wissen:</strong><br>
            • Raute ist flexibel (nicht rigid)<br>
            • Jede Position hat eine Aufgabe<br>
            • TW sind Teil des Spiels (nicht isoliert)<br>
            • Teamgeist wichtiger als perfekte Formation<br>
            • Wenn es chaotisch wird: zurück zu Grundlagen (Kopf hoch, Anspiel-Angebot)
          </div>
        `
      }
    ];

    function renderPlans() {
      const listEl = document.getElementById('plansList');
      
      if (plans.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><p>Noch keine Trainingseinheiten vorhanden</p></div>';
        return;
      }
      
      listEl.innerHTML = plans.map(plan => `
        <div class="plan-card" data-id="${plan.id}">
          <div class="plan-header">
            <div class="plan-info">
              <div class="plan-title">${plan.title}</div>
              <div class="plan-meta">
                <span>📅 ${new Date(plan.date).toLocaleDateString('de-DE', {year: 'numeric', month: 'long', day: 'numeric'})}</span>
                <span>⏱ ${plan.duration}</span>
                <span>👥 ${plan.participants}</span>
              </div>
            </div>
            <div class="plan-toggle">▼</div>
          </div>
          <div class="plan-content">
            <div class="plan-body">
              <p><strong>Fokus:</strong> ${plan.focus}</p>
              ${plan.html}
            </div>
          </div>
        </div>
      `).join('');
      
      // Add click handlers
      document.querySelectorAll('.plan-card').forEach(card => {
        card.querySelector('.plan-header').addEventListener('click', () => {
          card.classList.toggle('expanded');
        });
      });
    }

    // Initial render
    renderPlans();
  </script>
</body>
</html>
